[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "clownhead"
version = "0.8.0"
description = "Claude Code local sessions monitor and manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Urbański", email = "rooter@kyberian.net" }]
keywords = ["claude", "claude-code", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "google-re2>=1.1",
    "pydantic>=2.7",
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/rooterkyberian/clownhead"
Documentation = "https://rooterkyberian.github.io/clownhead/"
Issues = "https://github.com/rooterkyberian/clownhead/issues"

[project.scripts]
clownhead = "clownhead.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
docs = ["mkdocs-material>=9.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=clownhead --cov=tools --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PTH", "S", "SIM", "UP", "W"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S108"]

[tool.mypy]
files = ["src", "tools"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true
