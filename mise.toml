[tools]
python = "3.13"
uv = "latest"
actionlint = "latest"

[env]
UV_PYTHON_DOWNLOADS = "automatic"

[tasks.install]
description = "Sync the development environment"
run = "uv sync --all-groups"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Check style with ruff and actionlint"
run = ["uv run ruff check .", "uv run ruff format --check .", "actionlint"]

[tasks.lint-fix]
description = "Autoformat and autofix with ruff"
alias = "format"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
description = "Type check with mypy"
run = "uv run mypy"

[tasks.check]
description = "Run lint, typecheck and tests"
depends = ["lint", "typecheck", "test"]

[tasks.build]
description = "Build the sdist and wheel"
run = "uv build"

[tasks.docs]
description = "Serve the documentation site at http://127.0.0.1:8000"
run = "uv run --group docs mkdocs serve"

[tasks.docs-build]
description = "Build the documentation site, failing on a broken link"
run = "uv run --group docs mkdocs build --strict"

[tasks.demo]
description = "Re-record the README demo GIF with vhs"
run = ["uv sync", "vhs docs/demo.tape"]

[tasks.social-preview]
description = "Screenshot the demo board for the GitHub social preview, which needs resvg"
run = [
    "uv run clownhead-demo --screenshot docs/social-preview.svg",
    "resvg docs/social-preview.svg docs/social-preview.png --width 1280",
]
