[tools]
python = "3.13"
uv = "latest"
actionlint = "latest"

[env]
UV_PYTHON_DOWNLOADS = "automatic"

[tasks.install]
description = "Sync the development environment"
run = "uv sync --all-groups"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Check style with ruff and actionlint"
run = ["uv run ruff check .", "uv run ruff format --check .", "actionlint"]

[tasks.lint-fix]
description = "Autoformat and autofix with ruff"
alias = "format"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
description = "Type check with mypy"
run = "uv run mypy"

[tasks.check]
description = "Run lint, typecheck and tests"
depends = ["lint", "typecheck", "test"]

[tasks.build]
description = "Build the sdist and wheel"
run = "uv build"

[tasks.demo]
description = "Re-record the README demo GIF with vhs"
run = ["uv sync", "vhs docs/demo.tape"]

[tasks.social-preview]
description = "Cut the GitHub social preview PNG out of the demo GIF with ffmpeg"
run = "ffmpeg -y -ss 3.2 -i docs/demo.gif -frames:v 1 -vf scale=1280:640:flags=lanczos docs/social-preview.png"
