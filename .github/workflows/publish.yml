name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One upload at a time, and never cancel one that is already publishing.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: The tag has to name the version being published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import clownhead; print(clownhead.__version__)')
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not name clownhead $version" >&2
            exit 1
          fi
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clownhead
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
